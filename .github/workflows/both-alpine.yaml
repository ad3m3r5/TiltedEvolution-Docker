name: "[both-alpine] Force Build and Push"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "TiltedEvolution version to build (without the leading v), e.g. 1.8.1"
        required: true
        default: "1.8.1"
      latest:
        description: "Also tag as latest"
        type: boolean
        default: true

jobs:
  both-alpine:
    uses: ./.github/workflows/build-server.yaml
    permissions:
      contents: read
      packages: write
    with:
      os: alpine
      tag: ${{ inputs.tag }}
      latest: ${{ inputs.latest }}
      pterodactyl: true
    secrets: inherit
