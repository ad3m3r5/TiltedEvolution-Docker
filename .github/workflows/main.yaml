name: "[server, pterodactyl] Auto Build and Push"
# run every two hours to check for updates
on:
#  schedule:
#  - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps.tags.outputs.git_tag }}
      build: ${{ steps.tags.outputs.build }}

    steps:
      - name: Get latest tags
        id: tags
        run: |
          # version sort (sort -V) so 1.10.0 > 1.9.0, and only plain vX.Y.Z / X.Y.Z tags (skips "-debian", "latest", etc.)
          GIT_TAG_V=$(curl -sL "https://api.github.com/repos/tiltedphoques/TiltedEvolution/tags?per_page=100" | jq -r '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          GIT_TAG=${GIT_TAG_V#v}
          DOCKER_TAG=$(curl -sL "https://hub.docker.com/v2/repositories/${{ vars.DOCKERHUB_USERNAME }}/tiltedevolution-server/tags?page_size=100" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Git: ${GIT_TAG}"
          echo "Docker: ${DOCKER_TAG}"
          echo "git_tag=${GIT_TAG}" >> $GITHUB_OUTPUT
          if [ -n "$GIT_TAG" ] && [ "$GIT_TAG" != "$DOCKER_TAG" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

  alpine:
    needs: main
    if: ${{ needs.main.outputs.build == 'true' }}
    uses: ./.github/workflows/build-server.yaml
    permissions:
      contents: read
      packages: write
    with:
      os: alpine
      tag: ${{ needs.main.outputs.git_tag }}
      latest: true
      pterodactyl: true
    secrets: inherit

  debian:
    needs: main
    if: ${{ needs.main.outputs.build == 'true' }}
    uses: ./.github/workflows/build-server.yaml
    permissions:
      contents: read
      packages: write
    with:
      os: debian
      tag: ${{ needs.main.outputs.git_tag }}
      latest: true
      pterodactyl: true
    secrets: inherit
